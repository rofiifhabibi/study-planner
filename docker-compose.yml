version: '3.8'

services:
  laravel_app:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: laravel_app
    restart: always
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - .:/var/www/html
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
